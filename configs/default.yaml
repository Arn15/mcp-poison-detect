# Single source of truth for every experiment setting.
# Override per run:  python scripts/xxx.py --config configs/default.yaml --set detector.lr=3e-5
project:
  name: mcp-poison-detect
  seed: 42

paths:
  # Resolved relative to the detected runtime root (local / kaggle / colab), see mcptp/utils/env.py
  data_raw: data/raw
  data_processed: data/processed
  splits: data/splits
  outputs: outputs
  hf_cache: hf_cache

data:
  mcptox_repo: https://github.com/zhiqiangwang4/MCPTox-Benchmark   # files: pure_tool.json, response_all.json, def_tool/
  mcptox_commit: f85189f9ad12504c197c7f920ab818a40657b1fa
  split_version: v1
  split_strategy: server_disjoint
  test_frac: 0.2
  val_frac: 0.1
  heldout_risk_families: [Financial Loss, Message Hijacking]   # never trained on; frozen in split_v1
  include_explicit: true             # keep Template-1 (explicit) as positives; primary metric is implicit-only
  hard_negatives_per_server: 8
  max_cases: 300                     # compute-scaled subset (~200-300)

para:                                # MCPTox-Para: meaning-preserving LLM paraphrases (Step 2b)
  version: v1
  model: Qwen/Qwen3-4B
  backend: transformers              # transformers | echo (CPU smoke test)
  splits: [test]                     # add train for the augmentation ablation
  n_per_example: {train: 1, val: 1, test: 2}
  styles: [formal API reference, concise developer note, plain friendly English, verbose explanatory documentation,
           terse changelog-like, technical specification]
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 384
  batch_size: 16
  max_retries: 2
  min_value_recall: 0.8              # share of quoted values / paths / numbers that must survive
  length_ratio: [0.5, 2.2]

context:
  name_match: true
  semantic_match: true
  embedder: intfloat/e5-base-v2
  top_k: 3
  sim_threshold: 0.80
  max_context_tokens: 256

detector:
  backbone: microsoft/deberta-v3-base
  use_context: true                  # false = baseline B3
  max_len: 384
  seeds: [42, 43, 44]
  lr: 2.0e-5
  batch_size: 16
  epochs: 4
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true
  max_steps: null                    # smoke tests only
  context_dropout: 0.3               # context model: drop the referenced-tool context with this prob
  context_swap: 0.5                  # context model: give context-free benign tools random registry tools as context
  variants:                          # trained by scripts/train_detector.py
    B3_plain:           {use_context: false, train_para: false}
    B3_plain+para:      {use_context: false, train_para: true}
    ours_context:       {use_context: true,  train_para: false}
    ours_context+para:  {use_context: true,  train_para: true}
  compare:                           # paired bootstrap (a - b)
    - [ours_context, B3_plain]
    - [ours_context+para, B3_plain+para]
    - [B3_plain+para, B3_plain]
    - [ours_context+para, ours_context]
    - [ours_context, ours_context/SHUFFLED]
    - [ours_context+para, ours_context+para/SHUFFLED]
    - [ours_context, B0_tfidf_lr]

attacker:
  attacker_model: Qwen/Qwen3-4B
  evaluator_model: Qwen/Qwen3-8B      # target agent; MCPTox has recorded labels for Qwen3-8B
  agent_device: cuda:1
  agent_quant: 4bit                  # Qwen3-8B fp16 (~16.4GB) > one T4 (15GB); 4-bit NF4 ~6GB
  attacker_device: cuda:0            # Qwen3-4B fp16 (~8GB)
  target_models: [Qwen/Qwen3-8B, meta-llama/Llama-3.1-8B-Instruct]
  n_candidates: 5                    # N
  iterations: 2                      # T
  shadow_queries: 5
  temperature: 0.9
  max_new_tokens: 384
  asr_weight: 1.0
  evasion_weight: 1.0
  asr_floor: 0.2                     # keep only rewrites that still work on the agent
  max_seeds: null
  seed_split: train                  # train (attack data for training) | test (held-out robustness evaluation)
  detector_ckpt: null                # null (round 0); "train" to train + put a detector in the loop (round >=1); or a path
  detector_context: false            # when detector_ckpt=="train": train a context (true) or plain (false) detector
  backend: transformers              # transformers | echo
  # round-2 knobs (attacker.preset=r2 sets the stronger values; see scripts/run_attack.py)
  preset: null
  attacker_quant: null               # null (fp16) | 4bit | prequant (checkpoint already bnb-4bit)
  dedupe_seeds: false
  feedback: basic                    # basic | rich (logit margin + occlusion-salient words + benign examples)
  start_from: seed                   # seed | best (hill-climb from best working rewrite)
  selection: prob                    # prob | margin
  early_stop: false
  max_hours: 11.0                    # Kaggle sessions end at 12 h; stop cleanly before
  shard: null                        # "i/n"
  vllm:
    enable_prefix_caching: true
    gpu_memory_utilization: 0.85
    max_model_len: 8192
    quantization: null               # e.g. awq / bitsandbytes for 8B on T4

whitebox:                            # Step 6: gradient-guided word-substitution attack (scripts/attack_whitebox.py)
  detector_ckpt: train               # "train" = train the +para plain detector (detector.backbone) in-run; or a ckpt path
  rounds: [r0, r1, r1b, r1t, r2, r2t]  # start from control-verified working attacks of these rounds
  kinds: [opt]                       # opt (optimized rewrites) and/or orig (MCPTox originals)
  max_items: null
  shard: null                        # "i/n"
  steps: 60                          # max accepted-or-rejected swap steps per description
  batch: 64                          # candidate swaps scored exactly per step
  topk: 32                           # gradient top-k replacement words per position
  max_frac: 0.15                     # word budget: at most max(min_budget, max_frac * n_words) words changed
  min_budget: 2
  patience: 15                       # stop after this many steps without improvement
  min_word_len: 2
  target_fpr: 0.01                   # success = margin below the val-negative threshold at this FPR
  verify: true                       # agent no-poison control on every evading rewrite (needs GPU_DEPS for 4-bit agent)
  verify_all: false
  queries: 10
  max_hours: 11.0
  calibrated: false                  # Step 11: attack the registry-relative per-server threshold instead of the global one
  natural: false                     # Step 13: fluency-constrained swaps (masked-LM top-k in context + GPT-2 budget)
  mlm: distilroberta-base            # natural mode: contextual candidate words
  lm: gpt2                           # natural mode: log-perplexity budget
  mlm_k: 50
  max_dnll: 0.25                     # max rise in mean token NLL (nats) over the starting description
  nat_positions: 16                  # word positions tried per step
  nat_per_position: 4                # best-by-gradient MLM candidates per position

advtrain:                            # Step 7: adversarial training on white-box rewrites (scripts/adv_train.py)
  sources: [results/wb1/whitebox.jsonl, results/wb1e5/whitebox.jsonl]
  train_rounds: [r0, r1, r1b, r2]    # train-split seeds only enter training
  heldout_rounds: [r1t, r2t]         # held-out test seeds: evaluation only
  only_evaded: false                 # false = every final rewrite (label 1); true = only threshold evaders
  seeds: [42, 43, 44]
  save_seed: 42                      # ADV checkpoint saved for the white-box re-attack

defense:                             # Step 8: cheap defenses vs white-box evaders (scripts/defense_checks.py)
  parts: [fluency, calibration]
  wb_runs: [results/wb1, results/wb1e5]
  lm: gpt2
  fprs: [0.01, 0.05]
  ckpts: {}
  floor: 0.2

caladv:                              # Step 9: adversarial training x registry-relative calibration (scripts/calibrate_adv.py)
  seed: 42
  adv_sources: [results/wb1, results/wb1e5]   # round 2: add results/wb3_base_b30_<deb|e5>, results/wb3_adv_b30_<deb|e5>
  train_rounds: [r0, r1, r1b, r2]
  heldout_rounds: [r1t, r2t]
  wb30: [results/wb3_base_b30_deb, results/wb3_base_b30_e5]
  wb30adv: [results/wb3_adv_b30_deb, results/wb3_adv_b30_e5]
  fprs: [0.01, 0.05]

contam:                              # Step 12: contaminated-registry test (scripts/registry_contam.py)
  seeds: [42]
  adv_sources: null                  # null = round-2 sources for detector.backbone
  train_rounds: [r0, r1, r1b, r2]
  heldout_rounds: [r1t, r2t]
  fpr: 0.01
  k_naive: [1, 2, 3]                 # poisoned tools already registered per server
  draws: 5
  k_ratchet: [1, 2, 3, 5, 10]        # stepping-stone tools in the adaptive ratchet
  cap_offsets: [0.0, 2.0, 4.0]       # anchor cap = max validation anchor + offset (logits)
  fake_scores: false                 # CPU smoke test of the analysis with random margins

adversarial:
  rounds: 2

baselines:
  b1_e5:
    backbone: intfloat/multilingual-e5-base
    lr: 2.0e-5
    epochs: 4
  b2_llm_judge:
    model: Qwen/Qwen3-8B
  b3_plain_deberta:
    use_context: false

eval:
  target_fpr: 0.01
  extra_fprs: [0.05]                 # test has ~150 negatives, so 1% FPR is coarse; also report 5%
  bootstrap_iters: 1000
  ci: 0.95

checkpoint:
  every_n_items: 20
