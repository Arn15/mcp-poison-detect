[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcptp"
version = "0.1.0"
description = "Adversarially robust detection of implicit MCP tool poisoning"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "numpy", "pandas", "scikit-learn", "tqdm"]

[tool.setuptools.packages.find]
include = ["mcptp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
